name: Copy Image to Docker Hub

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  copy-image:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull from ghcr.io and push to Docker Hub
        run: |
          # Pull the existing image from ghcr.io
          docker pull ghcr.io/aadijain725/design2garmentcode-impl:runpod-end2end-pipeline
          
          # Tag for Docker Hub
          docker tag ghcr.io/aadijain725/design2garmentcode-impl:runpod-end2end-pipeline ${{ secrets.DOCKERHUB_USERNAME }}/design2garmentcode-impl:runpod-end2end-pipeline
          docker tag ghcr.io/aadijain725/design2garmentcode-impl:runpod-end2end-pipeline ${{ secrets.DOCKERHUB_USERNAME }}/design2garmentcode-impl:latest
          
          # Push to Docker Hub
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/design2garmentcode-impl:runpod-end2end-pipeline
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/design2garmentcode-impl:latest
          
          echo "✅ Image copied to Docker Hub!"
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/design2garmentcode-impl:runpod-end2end-pipeline"
