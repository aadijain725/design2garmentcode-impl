version: '3.8'

services:
  design2garment:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SKIP_MODELS: 0  # Set to 1 to skip model download during build
    image: design2garmentcode:latest
    container_name: design2garment
    ports:
      - "8080:8080"
    volumes:
      # Persist models (so they don't re-download on container restart)
      - d2g-models:/app/lmm_utils/Qwen
      # Persist outputs and logs
      - ./Logs:/app/Logs
      - ./outputs:/app/outputs
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Allow time for model loading

  # Optional: Cloudflare tunnel service
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: d2g-tunnel
    command: tunnel --no-autoupdate --url http://design2garment:8080
    depends_on:
      design2garment:
        condition: service_healthy
    restart: unless-stopped

volumes:
  d2g-models:
    name: design2garmentcode-models
